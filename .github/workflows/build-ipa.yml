name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0）'
        required: true
        default: '0.1.0'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 选择 Xcode Beta 版本
        run: |
          sudo xcode-select -s /Applications/Xcode-beta.app/Contents/Developer
          xcodebuild -version

      - name: 构建并归档（无签名）
        run: |
          DEVELOPER_DIR=/Applications/Xcode-beta.app/Contents/Developer \
          xcodebuild archive \
            -project HarnessMobile.xcodeproj \
            -scheme HarnessMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/HarnessMobile.xcarchive \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 打包未签名 IPA
        run: |
          cd build/HarnessMobile.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r ../../../HarnessMobile-unsigned.ipa Payload
          cd ../../..
          mv HarnessMobile-unsigned.ipa ./

      - name: 上传 IPA 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HarnessMobile-unsigned-${{ github.event.inputs.version }}
          path: HarnessMobile-unsigned.ipa
          retention-days: 14
