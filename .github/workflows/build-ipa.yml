name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0）'
        required: true
        default: '0.1.0'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - name: 检出仓库（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 查找并选择 Xcode 版本
        run: |
          echo "当前系统中可用的 Xcode："
          ls /Applications/ | grep Xcode
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "正在使用：$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: 构建 iSH 模拟器依赖 (根据官方文档)
        run: |
          # 1. 进入 iSH 子模块目录
          cd Vendor/OpenMinisISH
          
          # 2. 为构建脚本添加执行权限
          chmod +x deps/build_ish.sh
          
          # 3. 执行官方构建脚本，生成 HarnessISH.xcframework
          echo "开始构建 HarnessISH.xcframework，请耐心等待..."
          ./deps/build_ish.sh
          
          # 4. 验证产物是否已生成
          echo "检查 Artifacts 目录："
          ls -la Artifacts/ || echo "构建失败，Artifacts 目录不存在"

      - name: 构建并归档（无签名）
        run: |
          xcodebuild archive \
            -project HarnessMobile.xcodeproj \
            -scheme HarnessMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/HarnessMobile.xcarchive \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 打包未签名 IPA
        run: |
          cd build/HarnessMobile.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r ../../../HarnessMobile-unsigned.ipa Payload
          cd ../../..
          mv HarnessMobile-unsigned.ipa ./

      - name: 上传 IPA 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HarnessMobile-unsigned-${{ github.event.inputs.version }}
          path: HarnessMobile-unsigned.ipa
          retention-days: 14
